name: CI and Deploy to EC2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Package Spring Boot application
        run: mvn -B -DskipTests package
      - name: Build Docker image
        run: docker build -t employee-management-springboot:${{ github.sha }} .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/employee-management-springboot"
            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is missing on EC2. Install Docker Engine and the Compose plugin first."
              exit 1
            fi
            docker compose up -d --build
            docker image prune -f
            docker ps --filter name=employee-management-springboot
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8080/api/health
